<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Platform - Главная</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #fff;
            overflow-x: hidden;
        }
        #root {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // API функции
        const api = {
            getMovies: async (page = 1, search = '') => {
                let url = `/api/movies?page=${page}&limit=20`;
                if (search) url += `&search=${encodeURIComponent(search)}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('Ошибка загрузки');
                return res.json();
            },
            register: async (userData) => {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Ошибка регистрации');
                }
                return res.json();
            },
            login: async (email, password) => {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Ошибка входа');
                }
                const data = await res.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify({
                    userId: data.userId,
                    firstName: data.firstName,
                    lastName: data.lastName,
                    email: data.email,
                    role: data.role
                }));
                return data;
            },
            logout: () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
            }
        };

        // Header компонент
        function Header({ user, onLoginClick, onRegisterClick, onLogout, onProfileClick }) {
            const headerStyle = {
                position: 'fixed',
                top: 0,
                width: '100%',
                zIndex: 1000,
                background: 'linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%)',
                padding: '20px 50px',
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                transition: 'background 0.3s'
            };

            const logoStyle = {
                fontSize: '28px',
                fontWeight: 'bold',
                color: '#e50914',
                textDecoration: 'none',
                cursor: 'pointer'
            };

            const navStyle = {
                display: 'flex',
                gap: '30px',
                alignItems: 'center'
            };

            const linkStyle = {
                color: '#fff',
                textDecoration: 'none',
                fontSize: '16px',
                transition: 'color 0.3s',
                cursor: 'pointer'
            };

            const buttonStyle = {
                padding: '8px 20px',
                borderRadius: '4px',
                border: 'none',
                cursor: 'pointer',
                fontSize: '14px',
                fontWeight: 'bold',
                transition: 'all 0.3s'
            };

            const loginBtnStyle = {
                ...buttonStyle,
                background: 'transparent',
                color: '#fff',
                border: '1px solid #fff'
            };

            const registerBtnStyle = {
                ...buttonStyle,
                background: '#e50914',
                color: '#fff'
            };

            const userMenuStyle = {
                display: 'flex',
                alignItems: 'center',
                gap: '15px',
                position: 'relative'
            };

            const avatarStyle = {
                width: '40px',
                height: '40px',
                borderRadius: '50%',
                background: '#e50914',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                cursor: 'pointer',
                fontSize: '18px',
                fontWeight: 'bold'
            };

            return (
                <header style={headerStyle}>
                    <a href="/" style={logoStyle}>MOVIE</a>
                    <nav style={navStyle}>
                        <a href="/movies" style={linkStyle}>Каталог</a>
                        {user ? (
                            <div style={userMenuStyle}>
                                <div style={avatarStyle} onClick={onProfileClick}>
                                    {user.firstName?.[0]?.toUpperCase() || 'U'}
                                </div>
                                <button style={loginBtnStyle} onClick={onLogout}>
                                    Выйти
                                </button>
                            </div>
                        ) : (
                            <>
                                <button style={loginBtnStyle} onClick={onLoginClick}>
                                    Войти
                                </button>
                                <button style={registerBtnStyle} onClick={onRegisterClick}>
                                    Регистрация
                                </button>
                            </>
                        )}
                    </nav>
                </header>
            );
        }

        // Auth Modal компонент
        function AuthModal({ isOpen, mode, onClose, onSwitch, onSuccess }) {
            const [formData, setFormData] = useState({
                firstName: '',
                lastName: '',
                email: '',
                password: ''
            });
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            if (!isOpen) return null;

            const overlayStyle = {
                position: 'fixed',
                top: 0,
                left: 0,
                right: 0,
                bottom: 0,
                background: 'rgba(0,0,0,0.8)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                zIndex: 2000
            };

            const modalStyle = {
                background: '#141414',
                padding: '40px',
                borderRadius: '8px',
                width: '90%',
                maxWidth: '450px',
                position: 'relative'
            };

            const closeBtnStyle = {
                position: 'absolute',
                top: '15px',
                right: '15px',
                background: 'transparent',
                border: 'none',
                color: '#fff',
                fontSize: '24px',
                cursor: 'pointer'
            };

            const titleStyle = {
                fontSize: '32px',
                marginBottom: '30px',
                fontWeight: 'bold'
            };

            const inputStyle = {
                width: '100%',
                padding: '15px',
                marginBottom: '15px',
                background: '#333',
                border: '1px solid #444',
                borderRadius: '4px',
                color: '#fff',
                fontSize: '16px'
            };

            const submitBtnStyle = {
                width: '100%',
                padding: '15px',
                background: '#e50914',
                color: '#fff',
                border: 'none',
                borderRadius: '4px',
                fontSize: '16px',
                fontWeight: 'bold',
                cursor: 'pointer',
                marginTop: '10px'
            };

            const switchStyle = {
                textAlign: 'center',
                marginTop: '20px',
                color: '#b3b3b3'
            };

            const linkStyle = {
                color: '#fff',
                cursor: 'pointer',
                textDecoration: 'underline'
            };

            const errorStyle = {
                color: '#e50914',
                marginBottom: '15px'
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    if (mode === 'login') {
                        await api.login(formData.email, formData.password);
                    } else {
                        await api.register(formData);
                    }
                    onSuccess();
                    onClose();
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div style={overlayStyle} onClick={onClose}>
                    <div style={modalStyle} onClick={(e) => e.stopPropagation()}>
                        <button style={closeBtnStyle} onClick={onClose}>×</button>
                        <h2 style={titleStyle}>{mode === 'login' ? 'Вход' : 'Регистрация'}</h2>
                        {error && <div style={errorStyle}>{error}</div>}
                        <form onSubmit={handleSubmit}>
                            {mode === 'register' && (
                                <>
                                    <input
                                        type="text"
                                        placeholder="Имя"
                                        value={formData.firstName}
                                        onChange={(e) => setFormData({...formData, firstName: e.target.value})}
                                        style={inputStyle}
                                        required
                                    />
                                    <input
                                        type="text"
                                        placeholder="Фамилия"
                                        value={formData.lastName}
                                        onChange={(e) => setFormData({...formData, lastName: e.target.value})}
                                        style={inputStyle}
                                        required
                                    />
                                </>
                            )}
                            <input
                                type="email"
                                placeholder="Email"
                                value={formData.email}
                                onChange={(e) => setFormData({...formData, email: e.target.value})}
                                style={inputStyle}
                                required
                            />
                            <input
                                type="password"
                                placeholder="Пароль"
                                value={formData.password}
                                onChange={(e) => setFormData({...formData, password: e.target.value})}
                                style={inputStyle}
                                required
                                minLength="6"
                            />
                            <button type="submit" style={submitBtnStyle} disabled={loading}>
                                {loading ? 'Загрузка...' : (mode === 'login' ? 'Войти' : 'Зарегистрироваться')}
                            </button>
                        </form>
                        <div style={switchStyle}>
                            {mode === 'login' ? (
                                <>Нет аккаунта? <span style={linkStyle} onClick={onSwitch}>Зарегистрироваться</span></>
                            ) : (
                                <>Уже есть аккаунт? <span style={linkStyle} onClick={onSwitch}>Войти</span></>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Hero секция
        function Hero({ featuredMovie }) {
            if (!featuredMovie) return null;

            const heroStyle = {
                height: '80vh',
                position: 'relative',
                display: 'flex',
                alignItems: 'center',
                background: `linear-gradient(to right, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.3) 100%), url(${featuredMovie.poster_path})`,
                backgroundSize: 'cover',
                backgroundPosition: 'center',
                padding: '0 50px',
                marginTop: '80px'
            };

            const contentStyle = {
                maxWidth: '600px',
                zIndex: 1
            };

            const titleStyle = {
                fontSize: '64px',
                fontWeight: 'bold',
                marginBottom: '20px',
                textShadow: '2px 2px 4px rgba(0,0,0,0.8)'
            };

            const descStyle = {
                fontSize: '18px',
                marginBottom: '30px',
                lineHeight: '1.6',
                textShadow: '1px 1px 2px rgba(0,0,0,0.8)'
            };

            const buttonGroupStyle = {
                display: 'flex',
                gap: '15px'
            };

            const playBtnStyle = {
                padding: '15px 40px',
                background: '#fff',
                color: '#000',
                border: 'none',
                borderRadius: '4px',
                fontSize: '18px',
                fontWeight: 'bold',
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                gap: '10px'
            };

            const infoBtnStyle = {
                padding: '15px 40px',
                background: 'rgba(109, 109, 110, 0.7)',
                color: '#fff',
                border: 'none',
                borderRadius: '4px',
                fontSize: '18px',
                fontWeight: 'bold',
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                gap: '10px'
            };

            return (
                <div style={heroStyle}>
                    <div style={contentStyle}>
                        <h1 style={titleStyle}>{featuredMovie.title}</h1>
                        <p style={descStyle}>{featuredMovie.description}</p>
                        <div style={buttonGroupStyle}>
                            <button style={playBtnStyle} onClick={() => window.location.href = `/movie/${featuredMovie.id}`}>
                                <i className="fas fa-play"></i> Смотреть
                            </button>
                            <button style={infoBtnStyle} onClick={() => window.location.href = `/movie/${featuredMovie.id}`}>
                                <i className="fas fa-info-circle"></i> Подробнее
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Movie Carousel компонент
        function MovieCarousel({ title, movies, onMovieClick }) {
            const containerStyle = {
                padding: '40px 50px',
                marginTop: '20px'
            };

            const titleStyle = {
                fontSize: '24px',
                marginBottom: '20px',
                fontWeight: 'bold'
            };

            const carouselStyle = {
                display: 'flex',
                gap: '15px',
                overflowX: 'auto',
                scrollbarWidth: 'none',
                msOverflowStyle: 'none',
                paddingBottom: '10px'
            };

            const cardStyle = {
                minWidth: '200px',
                cursor: 'pointer',
                transition: 'transform 0.3s',
                borderRadius: '4px',
                overflow: 'hidden'
            };

            const imgStyle = {
                width: '100%',
                height: '300px',
                objectFit: 'cover',
                borderRadius: '4px'
            };

            return (
                <div style={containerStyle}>
                    <h2 style={titleStyle}>{title}</h2>
                    <div style={carouselStyle}>
                        {movies.map(movie => (
                            <div
                                key={movie.id}
                                style={cardStyle}
                                onMouseEnter={(e) => e.currentTarget.style.transform = 'scale(1.05)'}
                                onMouseLeave={(e) => e.currentTarget.style.transform = 'scale(1)'}
                                onClick={() => onMovieClick(movie.id)}
                            >
                                <img
                                    src={movie.poster_path}
                                    alt={movie.title}
                                    style={imgStyle}
                                    onError={(e) => e.target.src = 'https://via.placeholder.com/200x300?text=No+Image'}
                                />
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Главный компонент App
        function App() {
            const [user, setUser] = useState(null);
            const [movies, setMovies] = useState([]);
            const [featuredMovie, setFeaturedMovie] = useState(null);
            const [loading, setLoading] = useState(true);
            const [authModal, setAuthModal] = useState({ isOpen: false, mode: 'login' });

            useEffect(() => {
                const savedUser = localStorage.getItem('user');
                if (savedUser) {
                    setUser(JSON.parse(savedUser));
                }
                loadMovies();
            }, []);

            const loadMovies = async () => {
                try {
                    const data = await api.getMovies(1, '');
                    setMovies(data.data || []);
                    if (data.data && data.data.length > 0) {
                        setFeaturedMovie(data.data[0]);
                    }
                } catch (err) {
                    console.error('Ошибка загрузки фильмов:', err);
                } finally {
                    setLoading(false);
                }
            };

            const handleLogin = () => {
                setAuthModal({ isOpen: true, mode: 'login' });
            };

            const handleRegister = () => {
                setAuthModal({ isOpen: true, mode: 'register' });
            };

            const handleAuthSuccess = () => {
                const savedUser = localStorage.getItem('user');
                if (savedUser) {
                    setUser(JSON.parse(savedUser));
                }
            };

            const handleLogout = () => {
                api.logout();
                setUser(null);
            };

            const handleProfileClick = () => {
                window.location.href = '/profile';
            };

            const handleMovieClick = (movieId) => {
                window.location.href = `/movie/${movieId}`;
            };

            const switchAuthMode = () => {
                setAuthModal({
                    isOpen: true,
                    mode: authModal.mode === 'login' ? 'register' : 'login'
                });
            };

            const loadingContainerStyle = {
                display: 'flex',
                justifyContent: 'center',
                alignItems: 'center',
                height: '100vh'
            };

            const loadingTextStyle = {
                fontSize: '24px'
            };

            if (loading) {
                return (
                    <div style={loadingContainerStyle}>
                        <div style={loadingTextStyle}>Загрузка...</div>
                    </div>
                );
            }

            return (
                <div>
                    <Header
                        user={user}
                        onLoginClick={handleLogin}
                        onRegisterClick={handleRegister}
                        onLogout={handleLogout}
                        onProfileClick={handleProfileClick}
                    />
                    <Hero featuredMovie={featuredMovie} />
                    <MovieCarousel
                        title="Популярные фильмы"
                        movies={movies.slice(0, 10)}
                        onMovieClick={handleMovieClick}
                    />
                    <MovieCarousel
                        title="Новинки"
                        movies={movies.slice(10, 20)}
                        onMovieClick={handleMovieClick}
                    />
                    <AuthModal
                        isOpen={authModal.isOpen}
                        mode={authModal.mode}
                        onClose={() => setAuthModal({ isOpen: false, mode: 'login' })}
                        onSwitch={switchAuthMode}
                        onSuccess={handleAuthSuccess}
                    />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
