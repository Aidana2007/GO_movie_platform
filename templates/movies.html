<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог фильмов - Movie Platform</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const api = {
            getMovies: async (page = 1, search = '') => {
                let url = `/api/movies?page=${page}&limit=50`;
                if (search) url += `&search=${encodeURIComponent(search)}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('Ошибка загрузки');
                return res.json();
            }
        };

        function Header() {
            const headerStyle = {
                position: 'fixed',
                top: 0,
                width: '100%',
                zIndex: 1000,
                background: '#0f0f0f',
                padding: '20px 50px',
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                borderBottom: '1px solid #333'
            };

            const logoStyle = {
                fontSize: '28px',
                fontWeight: 'bold',
                color: '#e50914',
                textDecoration: 'none'
            };

            const navStyle = {
                display: 'flex',
                gap: '30px',
                alignItems: 'center'
            };

            const linkStyle = {
                color: '#fff',
                textDecoration: 'none',
                fontSize: '16px',
                transition: 'color 0.3s'
            };

            const activeLinkStyle = {
                ...linkStyle,
                color: '#e50914'
            };

            return (
                <header style={headerStyle}>
                    <a href="/app" style={logoStyle}>MOVIE</a>
                    <nav style={navStyle}>
                        <a href="/app" style={linkStyle}>Главная</a>
                        <a href="/movies" style={activeLinkStyle}>Каталог</a>
                    </nav>
                </header>
            );
        }

        function MoviesCatalog() {
            const [movies, setMovies] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const [search, setSearch] = useState('');
            const [searchInput, setSearchInput] = useState('');

            useEffect(() => {
                loadMovies();
            }, [search]);

            const loadMovies = async () => {
                setLoading(true);
                try {
                    const data = await api.getMovies(1, search);
                    setMovies(data.data || []);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleSearch = (e) => {
                e.preventDefault();
                setSearch(searchInput);
            };

            const containerStyle = {
                padding: '120px 50px 50px',
                minHeight: '100vh'
            };

            const searchContainerStyle = {
                marginBottom: '40px',
                maxWidth: '600px'
            };

            const searchFormStyle = {
                display: 'flex',
                gap: '10px'
            };

            const searchInputStyle = {
                flex: 1,
                padding: '15px 20px',
                background: '#1a1a1a',
                border: '1px solid #333',
                borderRadius: '4px',
                color: '#fff',
                fontSize: '16px'
            };

            const searchButtonStyle = {
                padding: '15px 30px',
                background: '#e50914',
                color: '#fff',
                border: 'none',
                borderRadius: '4px',
                fontSize: '16px',
                fontWeight: 'bold',
                cursor: 'pointer',
                transition: 'background 0.3s'
            };

            const gridStyle = {
                display: 'grid',
                gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))',
                gap: '20px'
            };

            const cardStyle = {
                cursor: 'pointer',
                transition: 'transform 0.3s',
                borderRadius: '4px',
                overflow: 'hidden'
            };

            const imgStyle = {
                width: '100%',
                height: '300px',
                objectFit: 'cover',
                borderRadius: '4px'
            };

            const titleStyle = {
                marginTop: '10px',
                fontSize: '16px',
                fontWeight: 'bold',
                color: '#fff'
            };

            const yearStyle = {
                marginTop: '5px',
                fontSize: '14px',
                color: '#b3b3b3'
            };

            const loadingTextStyle = {
                textAlign: 'center',
                fontSize: '24px'
            };

            const errorTextStyle = {
                color: '#e50914',
                fontSize: '18px'
            };

            const searchResultsStyle = {
                marginBottom: '20px',
                color: '#b3b3b3'
            };

            const emptyTextStyle = {
                textAlign: 'center',
                fontSize: '18px',
                color: '#b3b3b3'
            };

            if (loading) {
                return (
                    <div>
                        <Header />
                        <div style={containerStyle}>
                            <div style={loadingTextStyle}>Загрузка...</div>
                        </div>
                    </div>
                );
            }

            if (error) {
                return (
                    <div>
                        <Header />
                        <div style={containerStyle}>
                            <div style={errorTextStyle}>Ошибка: {error}</div>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    <Header />
                    <div style={containerStyle}>
                        <div style={searchContainerStyle}>
                            <form onSubmit={handleSearch} style={searchFormStyle}>
                                <input
                                    type="text"
                                    value={searchInput}
                                    onChange={(e) => setSearchInput(e.target.value)}
                                    placeholder="Поиск фильмов..."
                                    style={searchInputStyle}
                                />
                                <button type="submit" style={searchButtonStyle}>
                                    <i className="fas fa-search"></i> Поиск
                                </button>
                            </form>
                        </div>

                        {search && (
                            <div style={searchResultsStyle}>
                                Найдено: {movies.length} фильмов
                            </div>
                        )}

                        {movies.length === 0 ? (
                            <div style={emptyTextStyle}>
                                Фильмы не найдены
                            </div>
                        ) : (
                            <div style={gridStyle}>
                                {movies.map(movie => (
                                    <div
                                        key={movie.id}
                                        style={cardStyle}
                                        onMouseEnter={(e) => e.currentTarget.style.transform = 'scale(1.05)'}
                                        onMouseLeave={(e) => e.currentTarget.style.transform = 'scale(1)'}
                                        onClick={() => window.location.href = `/movie/${movie.id}`}
                                    >
                                        <img
                                            src={movie.poster_path}
                                            alt={movie.title}
                                            style={imgStyle}
                                            onError={(e) => e.target.src = 'https://via.placeholder.com/200x300?text=No+Image'}
                                        />
                                        <div style={titleStyle}>{movie.title}</div>
                                        <div style={yearStyle}>{movie.year}</div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<MoviesCatalog />, document.getElementById('root'));
    </script>
</body>
</html>
