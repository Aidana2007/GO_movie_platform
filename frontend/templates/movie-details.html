<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #fff;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: #0f0f0f;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #e50914;
            text-decoration: none;
        }

        .nav {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .nav a:hover {
            color: #e50914;
        }
        .nav a.active {
            color: #e50914;
        }

        .container {
            padding: 120px 50px 50px;
            min-height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero {
            display: flex;
            gap: 40px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .poster {
            width: 300px;
            height: 450px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .info {
            flex: 1;
            min-width: 300px;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .meta {
            font-size: 18px;
            color: #b3b3b3;
            margin-bottom: 20px;
        }

        .description {
            font-size: 18px;
            line-height: 1.6;
            color: #e5e5e5;
            margin-bottom: 30px;
        }

        .btn-play {
            padding: 15px 40px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: background 0.3s;
        }

        .btn-play:hover {
            background: #b8070e;
        }

        .section {
            margin-top: 50px;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .review-form {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .rating-input {
            padding: 10px 15px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
            width: 100px;
        }

        .rating-input:focus {
            outline: none;
            border-color: #e50914;
        }

        .textarea {
            width: 100%;
            padding: 15px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            min-height: 120px;
            resize: vertical;
        }

        .textarea:focus {
            outline: none;
            border-color: #e50914;
        }

        .btn-submit {
            padding: 12px 30px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background: #b8070e;
        }

        .btn-submit:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .login-prompt {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
            color: #b3b3b3;
            border: 1px solid #333;
        }

        .login-prompt a {
            color: #e50914;
            text-decoration: none;
            font-weight: bold;
        }

        .login-prompt a:hover {
            text-decoration: underline;
        }

        .review-item {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .review-rating {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }

        .review-date {
            font-size: 14px;
            color: #b3b3b3;
        }

        .review-comment {
            font-size: 16px;
            line-height: 1.6;
            color: #e5e5e5;
            margin-top: 10px;
        }

        .btn-delete {
            padding: 5px 10px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-delete:hover {
            background: #b8070e;
        }

        .empty-reviews {
            text-align: center;
            color: #b3b3b3;
            font-size: 18px;
            padding: 40px 0;
        }

        .loading-text, .error-text {
            text-align: center;
            font-size: 24px;
            margin-top: 50px;
        }

        .error-text {
            color: #e50914;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 50px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }
            .container {
                padding: 100px 20px 30px;
            }
            .hero {
                flex-direction: column;
            }
            .poster {
                width: 100%;
                max-width: 300px;
                margin: 0 auto;
            }
            .title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body data-page="{{.Page}}" data-year="{{.Year}}" data-app="{{.AppName}}">
    <header class="header">
        <a href="/app" class="logo">{{.AppName}}</a>
        <nav class="nav">
            <a href="/app" class="{{if eq .Page "app"}}active{{end}}">Главная</a>
            <a href="/movies" class="{{if or (eq .Page "movies") (eq .Page "movie")}}active{{end}}">Каталог</a>
        </nav>
    </header>

    <div id="loading" class="loading-text">
        <div class="spinner"></div>
    </div>

    <div id="error" class="error-text hidden"></div>

    <div id="content" class="container hidden"></div>

    <script>
        let currentUser = null;
        let movie = null;
        let reviews = [];
        const movieId = window.location.pathname.split('/').pop();

        const api = {
            getMovie: async (id) => {
                const res = await fetch(`/api/movies/${id}`);
                if (!res.ok) {
                    const text = await res.text();
                    let errorMsg = 'Фильм не найден';
                    try {
                        const err = JSON.parse(text);
                        errorMsg = err.error || errorMsg;
                    } catch (e) {
                        errorMsg = text || errorMsg;
                    }
                    throw new Error(errorMsg);
                }
                return res.json();
            },
            
            getReviews: async (id) => {
                const res = await fetch(`/api/movies/${id}/reviews`);
                if (!res.ok) {
                    const text = await res.text();
                    let errorMsg = 'Ошибка загрузки отзывов';
                    try {
                        const err = JSON.parse(text);
                        errorMsg = err.error || errorMsg;
                    } catch (e) {
                        errorMsg = text || errorMsg;
                    }
                    throw new Error(errorMsg);
                }
                const data = await res.json();
                return data.data || [];
            },
            
            addReview: async (movieId, rating, comment) => {
                const token = localStorage.getItem('token');
                if (!token) throw new Error('Необходимо войти');
                const res = await fetch(`/api/movies/${movieId}/reviews`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ rating, comment })
                });
                if (!res.ok) {
                    const text = await res.text();
                    let errorMsg = 'Ошибка добавления отзыва';
                    try {
                        const err = JSON.parse(text);
                        errorMsg = err.error || errorMsg;
                    } catch (e) {
                        errorMsg = text || errorMsg;
                    }
                    throw new Error(errorMsg);
                }
                const text = await res.text();
                return text ? JSON.parse(text) : { message: 'success' };
            },
            
            deleteReview: async (reviewId) => {
                const token = localStorage.getItem('token');
                if (!token) throw new Error('Необходимо войти');
                const res = await fetch(`/api/reviews/${reviewId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (!res.ok) {
                    const text = await res.text();
                    let errorMsg = 'Ошибка удаления отзыва';
                    try {
                        const err = JSON.parse(text);
                        errorMsg = err.error || errorMsg;
                    } catch (e) {
                        errorMsg = text || errorMsg;
                    }
                    throw new Error(errorMsg);
                }
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const savedUser = localStorage.getItem('user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
            }

            await loadData();
        });

        async function loadData() {
            try {
                const [movieData, reviewsData] = await Promise.all([
                    api.getMovie(movieId),
                    api.getReviews(movieId)
                ]);
                
                movie = movieData;
                reviews = reviewsData;
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                
                renderContent();
            } catch (err) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').textContent = 'Ошибка: ' + err.message;
                document.getElementById('error').classList.remove('hidden');
            }
        }

        function renderContent() {
            const content = document.getElementById('content');
            
            content.innerHTML = `
                <div class="hero">
                    <img 
                        src="${movie.poster_path}" 
                        alt="${movie.title}"
                        class="poster"
                        onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'"
                    >
                    <div class="info">
                        <h1 class="title">${movie.title}</h1>
                        <div class="meta">
                            Год: ${movie.year}
                        </div>
                        <p class="description">${movie.description}</p>
                        ${movie.video_path ? `
                            <button class="btn-play" onclick="window.open('${movie.video_path}', '_blank')">
                                <i class="fas fa-play"></i> Смотреть фильм
                            </button>
                        ` : ''}
                    </div>
                </div>

                <div class="section">
                    <h2 class="section-title">Отзывы (${reviews.length})</h2>
                    
                    ${currentUser ? `
                        <form class="review-form" id="review-form">
                            <div class="form-group">
                                <label>Оценка (1-5):</label>
                                <input 
                                    type="number" 
                                    id="rating" 
                                    class="rating-input"
                                    min="1" 
                                    max="5" 
                                    value="5" 
                                    required
                                >
                            </div>
                            <div class="form-group">
                                <label>Ваш отзыв:</label>
                                <textarea 
                                    id="comment" 
                                    class="textarea"
                                    placeholder="Напишите ваш отзыв..."
                                    required
                                ></textarea>
                            </div>
                            <button type="submit" class="btn-submit" id="submit-btn">
                                Отправить отзыв
                            </button>
                        </form>
                    ` : `
                        <div class="login-prompt">
                            <a href="/app">Войдите, чтобы оставить отзыв</a>
                        </div>
                    `}

                    <div id="reviews-container">
                        ${renderReviews()}
                    </div>
                </div>
            `;

            if (currentUser) {
                document.getElementById('review-form').addEventListener('submit', handleSubmitReview);
            }
        }

        function renderReviews() {
            if (reviews.length === 0) {
                return '<div class="empty-reviews">Пока нет отзывов</div>';
            }

            return reviews.map(review => `
                <div class="review-item">
                    <div class="review-header">
                        <div class="review-rating">
                            ${'★'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)} ${review.rating}/5
                        </div>
                        <div class="review-date">
                            ${formatDate(review.createdAt)}
                        </div>
                    </div>
                    <p class="review-comment">${review.comment}</p>
                    ${currentUser && (currentUser.userId === review.userId || currentUser.role === 'ADMIN') ? `
                        <button class="btn-delete" onclick="handleDeleteReview('${review.id}')">
                            Удалить
                        </button>
                    ` : ''}
                </div>
            `).join('');
        }

        async function handleSubmitReview(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            const rating = parseInt(document.getElementById('rating').value);
            const comment = document.getElementById('comment').value;
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';

            try {
                await api.addReview(movieId, rating, comment);
                await loadData();
                document.getElementById('comment').value = '';
                document.getElementById('rating').value = '5';
            } catch (err) {
                alert(err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить отзыв';
            }
        }

        async function handleDeleteReview(reviewId) {
            if (!confirm('Удалить отзыв?')) return;
            
            try {
                await api.deleteReview(reviewId);
                await loadData();
            } catch (err) {
                alert(err.message);
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ru-RU', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }
    </script>
</body>
</html>
