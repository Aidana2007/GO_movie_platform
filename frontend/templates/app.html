<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #fff;
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }

        .header.scrolled {
            background: #0f0f0f;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #e50914;
            text-decoration: none;
            transition: transform 0.3s;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .nav {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .nav a:hover {
            color: #e50914;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-login {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
        }

        .btn-login:hover {
            background: #fff;
            color: #0f0f0f;
        }

        .btn-register {
            background: #e50914;
            color: #fff;
        }

        .btn-register:hover {
            background: #b8070e;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-greeting {
            color: #b3b3b3;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.3s;
        }

        .avatar:hover {
            transform: scale(1.1);
        }

        .hero {
            height: 80vh;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding: 0 50px;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
        }

        .hero-content {
            max-width: 600px;
            z-index: 1;
        }

        .hero-title {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .hero-description {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #e5e5e5;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-play {
            padding: 15px 40px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .btn-play:hover {
            background: rgba(255,255,255,0.8);
        }

        .btn-info {
            padding: 15px 40px;
            background: rgba(109, 109, 110, 0.7);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .btn-info:hover {
            background: rgba(109, 109, 110, 0.9);
        }

        .carousel-section {
            padding: 40px 50px;
            margin-top: 20px;
        }

        .carousel-title {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .carousel {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding-bottom: 10px;
        }

        .carousel::-webkit-scrollbar {
            height: 10px;
        }

        .carousel::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .carousel::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 5px;
        }

        .carousel::-webkit-scrollbar-thumb:hover {
            background: #777;
        }

        .movie-card {
            min-width: 200px;
            cursor: pointer;
            transition: transform 0.3s;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 4px;
        }

        .movie-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 15px 10px 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .movie-card:hover .movie-overlay {
            opacity: 1;
        }

        .movie-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .movie-year {
            font-size: 12px;
            color: #b3b3b3;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #141414;
            padding: 50px;
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
            position: relative;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .modal-close:hover {
            transform: rotate(90deg);
        }

        .modal-title {
            font-size: 32px;
            margin-bottom: 30px;
            font-weight: bold;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b3b3b3;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #e50914;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background: #b8070e;
        }

        .btn-submit:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .error-message {
            background: #f44336;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
        }

        .switch-auth {
            text-align: center;
            margin-top: 20px;
            color: #b3b3b3;
        }

        .switch-auth a {
            color: #e50914;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }

        .switch-auth a:hover {
            text-decoration: underline;
        }

        .footer {
            background: #0f0f0f;
            padding: 40px 50px;
            margin-top: 60px;
            border-top: 1px solid #333;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #b3b3b3;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: #fff;
        }

        .copyright {
            color: #555;
            font-size: 14px;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            gap: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }
            .logo {
                font-size: 24px;
            }
            .hero {
                padding: 0 20px;
            }
            .hero-title {
                font-size: 36px;
            }
            .hero-description {
                font-size: 16px;
            }
            .carousel-section {
                padding: 30px 20px;
            }
            .footer {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body data-page="{{.Page}}" data-year="{{.Year}}" data-app="{{.AppName}}">
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div style="font-size: 24px;">Загрузка...</div>
    </div>

    <div id="main-content" class="hidden">
        <header id="header" class="header">
            <a href="/app" class="logo">{{.AppName}}</a>
            <nav class="nav" id="nav-menu"></nav>
        </header>

        <div id="hero" class="hero"></div>
        <div id="carousels"></div>

        <footer class="footer">
            <div class="footer-content">
                <div class="footer-links">
                    <a href="/app">О нас</a>
                    <a href="/movies">Каталог</a>
                    <a href="#">Помощь</a>
                    <a href="#">Контакты</a>
                </div>
                <div class="copyright">© {{.Year}} {{.AppName}}. Все права защищены.</div>
            </div>
        </footer>
    </div>

    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeAuthModal()">
                <i class="fas fa-times"></i>
            </button>
            <h2 class="modal-title" id="modal-title">Вход</h2>
            <div id="error-message" class="error-message hidden"></div>
            <form id="auth-form">
                <div id="name-fields" class="hidden">
                    <div class="form-group">
                        <label>Имя</label>
                        <input type="text" id="firstName" name="firstName">
                    </div>
                    <div class="form-group">
                        <label>Фамилия</label>
                        <input type="text" id="lastName" name="lastName">
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>
                <button type="submit" class="btn-submit" id="submit-btn">Войти</button>
            </form>
            <div class="switch-auth">
                <span id="switch-text">Нет аккаунта? </span>
                <a id="switch-link" onclick="switchAuthMode()">Зарегистрироваться</a>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let movies = [];
        let authMode = 'login';

        const api = {
            getMovies: async (page = 1, search = '') => {
                let url = `/api/movies?page=${page}&limit=20`;
                if (search) url += `&search=${encodeURIComponent(search)}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('Ошибка загрузки');
                return res.json();
            },
            
            register: async (userData) => {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                if (!res.ok) {
                    const text = await res.text();
                    let errorMsg = 'Ошибка регистрации';
                    try {
                        const err = JSON.parse(text);
                        errorMsg = err.error || errorMsg;
                    } catch (e) {
                        errorMsg = text || errorMsg;
                    }
                    throw new Error(errorMsg);
                }
                // Handle empty response or JSON response
                const text = await res.text();
                return text ? JSON.parse(text) : { message: 'success' };
            },
            
            login: async (email, password) => {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (!res.ok) {
                    const text = await res.text();
                    let errorMsg = 'Ошибка входа';
                    try {
                        const err = JSON.parse(text);
                        errorMsg = err.error || errorMsg;
                    } catch (e) {
                        errorMsg = text || errorMsg;
                    }
                    throw new Error(errorMsg);
                }
                const data = await res.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify({
                    userId: data.userId,
                    firstName: data.firstName,
                    lastName: data.lastName,
                    email: data.email,
                    role: data.role
                }));
                return data;
            },
            
            logout: () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const savedUser = localStorage.getItem('user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
            }

            await loadMovies();
            renderHeader();
            
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');

            window.addEventListener('scroll', () => {
                const header = document.getElementById('header');
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });
        });

        async function loadMovies() {
            try {
                const data = await api.getMovies(1, '');
                movies = data.data || [];
                
                if (movies.length > 0) {
                    renderHero(movies[0]);
                    renderCarousels();
                }
            } catch (err) {
                console.error('Ошибка загрузки фильмов:', err);
            }
        }

        function renderHeader() {
            const navMenu = document.getElementById('nav-menu');
            
            if (currentUser) {
                navMenu.innerHTML = `
                    <a href="/movies">Каталог</a>
                    <div class="user-menu">
                        <span class="user-greeting">Привет, ${currentUser.firstName}!</span>
                        <div class="avatar" onclick="window.location.href='/profile'" title="${currentUser.firstName}">
                            ${currentUser.firstName[0].toUpperCase()}
                        </div>
                        <button class="btn btn-login" onclick="handleLogout()">Выйти</button>
                    </div>
                `;
            } else {
                navMenu.innerHTML = `
                    <a href="/movies">Каталог</a>
                    <button class="btn btn-login" onclick="openAuthModal('login')">Войти</button>
                    <button class="btn btn-register" onclick="openAuthModal('register')">Регистрация</button>
                `;
            }
        }

        function renderHero(movie) {
            const hero = document.getElementById('hero');
            hero.style.backgroundImage = `linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 50%, transparent 100%), url(${movie.poster_path})`;
            
            const description = movie.description.length > 200 
                ? movie.description.substring(0, 200) + '...' 
                : movie.description;
            
            hero.innerHTML = `
                <div class="hero-content">
                    <h1 class="hero-title">${movie.title}</h1>
                    <p class="hero-description">${description}</p>
                    <div class="hero-buttons">
                        <button class="btn-play" onclick="window.location.href='/movie/${movie.id}'">
                            <i class="fas fa-play"></i> Смотреть
                        </button>
                        <button class="btn-info" onclick="window.location.href='/movie/${movie.id}'">
                            <i class="fas fa-info-circle"></i> Подробнее
                        </button>
                    </div>
                </div>
            `;
        }

        function renderCarousels() {
            const carouselsContainer = document.getElementById('carousels');
            
            const sections = [
                { title: 'Популярные фильмы', movies: movies.slice(0, 10) },
                { title: 'Новинки', movies: movies.slice(10, 20) }
            ];

            if (movies.length > 20) {
                sections.push({ title: 'Рекомендуем посмотреть', movies: movies.slice(0, 10).reverse() });
            }

            carouselsContainer.innerHTML = sections.map(section => `
                <div class="carousel-section">
                    <h2 class="carousel-title">${section.title}</h2>
                    <div class="carousel">
                        ${section.movies.map(movie => `
                            <div class="movie-card" onclick="window.location.href='/movie/${movie.id}'">
                                <img src="${movie.poster_path}" 
                                     alt="${movie.title}"
                                     onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'">
                                <div class="movie-overlay">
                                    <div class="movie-title">${movie.title}</div>
                                    <div class="movie-year">${movie.year}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function openAuthModal(mode) {
            authMode = mode;
            const modal = document.getElementById('auth-modal');
            const modalTitle = document.getElementById('modal-title');
            const nameFields = document.getElementById('name-fields');
            const submitBtn = document.getElementById('submit-btn');
            const switchText = document.getElementById('switch-text');
            const switchLink = document.getElementById('switch-link');
            const errorMessage = document.getElementById('error-message');
            
            errorMessage.classList.add('hidden');
            document.getElementById('auth-form').reset();

            if (mode === 'register') {
                modalTitle.textContent = 'Регистрация';
                nameFields.classList.remove('hidden');
                submitBtn.textContent = 'Зарегистрироваться';
                switchText.textContent = 'Уже есть аккаунт? ';
                switchLink.textContent = 'Войти';
                document.getElementById('firstName').required = true;
                document.getElementById('lastName').required = true;
            } else {
                modalTitle.textContent = 'Вход';
                nameFields.classList.add('hidden');
                submitBtn.textContent = 'Войти';
                switchText.textContent = 'Нет аккаунта? ';
                switchLink.textContent = 'Зарегистрироваться';
                document.getElementById('firstName').required = false;
                document.getElementById('lastName').required = false;
            }

            modal.classList.add('active');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.remove('active');
            document.getElementById('error-message').classList.add('hidden');
        }

        function switchAuthMode() {
            openAuthModal(authMode === 'login' ? 'register' : 'login');
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            const errorMessage = document.getElementById('error-message');
            
            errorMessage.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Загрузка...';

            try {
                const formData = {
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                };

                if (authMode === 'register') {
                    formData.firstName = document.getElementById('firstName').value;
                    formData.lastName = document.getElementById('lastName').value;
                    
                    await api.register(formData);
                    alert('Регистрация успешна! Теперь войдите.');
                    switchAuthMode();
                } else {
                    await api.login(formData.email, formData.password);
                    const savedUser = localStorage.getItem('user');
                    currentUser = JSON.parse(savedUser);
                    closeAuthModal();
                    renderHeader();
                }
            } catch (err) {
                errorMessage.textContent = err.message;
                errorMessage.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = authMode === 'login' ? 'Войти' : 'Зарегистрироваться';
            }
        });

        function handleLogout() {
            api.logout();
            currentUser = null;
            window.location.reload();
        }

        document.getElementById('auth-modal').addEventListener('click', (e) => {
            if (e.target.id === 'auth-modal') {
                closeAuthModal();
            }
        });
    </script>
</body>
</html>
