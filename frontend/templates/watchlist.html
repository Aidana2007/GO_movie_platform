{{define "title"}}Watchlist{{end}}

{{define "content"}}
<div class="container">
    <section class="watchlist-section">
        <h1>My Watchlist</h1>
        <div class="movie-grid" id="watchlist-grid">
            <!-- Watchlist movies will be loaded here -->
        </div>
        <p id="empty-message" class="no-results" style="display: none;">
            Your watchlist is empty. <a href="/movies">Browse movies</a> to add some!
        </p>
    </section>
</div>
{{end}}

{{define "scripts"}}
<script src="../static/js/watchlist.js"></script>
{{end}}
