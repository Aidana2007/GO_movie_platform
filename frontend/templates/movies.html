<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: #0f0f0f;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #e50914;
            text-decoration: none;
        }

        .nav {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .nav a:hover {
            color: #e50914;
        }

        .nav a.active {
            color: #e50914;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.3s;
        }

        .avatar:hover {
            transform: scale(1.1);
        }

        .btn {
            padding: 8px 20px;
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #fff;
            color: #0f0f0f;
        }

        .container {
            padding: 120px 50px 50px;
            min-height: 100vh;
        }

        .search-container {
            margin-bottom: 40px;
            max-width: 100%;
        }

        .search-form {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #e50914;
        }

        .btn-search {
            padding: 15px 30px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-search:hover {
            background: #b8070e;
        }

        .btn-clear {
            padding: 15px 20px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-clear:hover {
            background: #555;
        }

        .search-results {
            margin-bottom: 20px;
            color: #b3b3b3;
            font-size: 18px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .movie-card {
            cursor: pointer;
            transition: transform 0.3s;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            background: #1a1a1a;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #fff;
        }

        .movie-year {
            font-size: 14px;
            color: #b3b3b3;
        }

        .loading-text {
            text-align: center;
            font-size: 24px;
            margin-top: 50px;
        }

        .error-text {
            color: #e50914;
            font-size: 18px;
            text-align: center;
            margin-top: 50px;
        }

        .empty-text {
            text-align: center;
            font-size: 18px;
            color: #b3b3b3;
            margin-top: 50px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 50px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }
            .container {
                padding: 100px 20px 30px;
            }
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }
        }
    </style>
</head>
<body data-page="{{.Page}}" data-year="{{.Year}}" data-app="{{.AppName}}">
    <header class="header">
        <a href="/app" class="logo">{{.AppName}}</a>
        <nav class="nav" id="nav-menu">
            <a href="/app" class="{{if eq .Page "app"}}active{{end}}">Главная</a>
            <a href="/movies" class="{{if eq .Page "movies"}}active{{end}}">Каталог</a>
        </nav>
    </header>

    <div class="container">
        <div class="search-container">
            <form class="search-form" id="search-form">
                <input 
                    type="text" 
                    class="search-input" 
                    id="search-input" 
                    placeholder="Поиск фильмов по названию..."
                >
                <button type="submit" class="btn-search">
                    <i class="fas fa-search"></i> Поиск
                </button>
                <button type="button" class="btn-clear hidden" id="btn-clear">
                    <i class="fas fa-times"></i>
                </button>
            </form>
        </div>

        <div id="search-results" class="search-results hidden"></div>
        <div id="loading" class="hidden">
            <div class="spinner"></div>
        </div>
        <div id="error" class="error-text hidden"></div>
        <div id="movies-grid" class="movies-grid"></div>
        <div id="empty" class="empty-text hidden">Фильмы не найдены</div>
    </div>

    <script>
        let currentUser = null;
        let movies = [];
        let currentSearch = '';

        const api = {
            getMovies: async (page = 1, search = '') => {
                let url = `/api/movies?page=${page}&limit=50`;
                if (search) url += `&search=${encodeURIComponent(search)}`;
                const res = await fetch(url);
                if (!res.ok) {
                    const text = await res.text();
                    let errorMsg = 'Ошибка загрузки';
                    try {
                        const err = JSON.parse(text);
                        errorMsg = err.error || errorMsg;
                    } catch (e) {
                        errorMsg = text || errorMsg;
                    }
                    throw new Error(errorMsg);
                }
                return res.json();
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const savedUser = localStorage.getItem('user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
            }

            renderHeader();
            await loadMovies('');
        });

        function renderHeader() {
            const navMenu = document.getElementById('nav-menu');
            let userHTML = '';

            if (currentUser) {
                userHTML = `
                    <div class="avatar" onclick="window.location.href='/profile'" title="${currentUser.firstName}">
                        ${currentUser.firstName[0].toUpperCase()}
                    </div>
                    <button class="btn" onclick="handleLogout()">Выйти</button>
                `;
            }

            navMenu.innerHTML = `
                <a href="/app" class="{{if eq .Page "app"}}active{{end}}">Главная</a>
                <a href="/movies" class="{{if eq .Page "movies"}}active{{end}}">Каталог</a>
                ${userHTML}
            `;
        }

        async function loadMovies(search) {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const grid = document.getElementById('movies-grid');
            const empty = document.getElementById('empty');
            const searchResults = document.getElementById('search-results');

            loading.classList.remove('hidden');
            error.classList.add('hidden');
            empty.classList.add('hidden');
            searchResults.classList.add('hidden');

            try {
                const data = await api.getMovies(1, search);
                movies = data.data || [];
                
                loading.classList.add('hidden');

                if (search) {
                    searchResults.textContent = `Найдено: ${movies.length} фильмов`;
                    searchResults.classList.remove('hidden');
                }

                if (movies.length === 0) {
                    empty.classList.remove('hidden');
                    grid.innerHTML = '';
                } else {
                    renderMovies();
                }
            } catch (err) {
                loading.classList.add('hidden');
                error.textContent = 'Ошибка: ' + err.message;
                error.classList.remove('hidden');
            }
        }

        function renderMovies() {
            const grid = document.getElementById('movies-grid');
            
            grid.innerHTML = movies.map(movie => `
                <div class="movie-card" onclick="window.location.href='/movie/${movie.id}'">
                    <img 
                        src="${movie.poster_path}" 
                        alt="${movie.title}"
                        onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'"
                    >
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-year">${movie.year}</div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const searchInput = document.getElementById('search-input');
            const btnClear = document.getElementById('btn-clear');
            
            currentSearch = searchInput.value.trim();
            
            if (currentSearch) {
                btnClear.classList.remove('hidden');
            }
            
            await loadMovies(currentSearch);
        });

        document.getElementById('btn-clear').addEventListener('click', async () => {
            const searchInput = document.getElementById('search-input');
            const btnClear = document.getElementById('btn-clear');
            
            searchInput.value = '';
            currentSearch = '';
            btnClear.classList.add('hidden');
            
            await loadMovies('');
        });

        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/app';
        }
    </script>
</body>
</html>
